/**:
  ros__parameters:
    frames/map: map
    # The Ouster mapping launch selects the atomic observation transport.
    # Paired cloud/PoseStamped remains available for legacy bags and previews.
    mapping/transport: paired
    # Exactly one mapper/backend may publish the dynamic map -> odom transform.
    mapping/publish_tf: true
    # 0 keeps every received keyframe point; a positive value enables voxel means.
    # Registration has a separate filter. Full keyframes/poses remain on disk.
    mapping/voxel_size: 0.0
    # Native dense pose-revision reconstruction; python keeps the reference path.
    # Voxelized archives retain the sample-weighted Python reconstruction in both modes.
    mapping/reconstruction_backend: native
    # Co-locate overlapping observations on ONE world grid for display/export.
    # Source keyframes/submaps stay dense. Set 0.0 for individual-return output.
    mapping/fusion_size: 0.02
    # Mapping observations are denser than odometry keyframes. The point cap
    # usually rolls first, retaining a useful viewing window at bounded memory.
    mapping/submap_keyframes: 100
    mapping/resident_submaps: 8
    # Per-submap point limit in both modes; roll early when the next frame won't fit.
    mapping/max_voxels: 1000000
    mapping/max_input_points: 200000
    mapping/max_cloud_bytes: 16777216
    mapping/pending_pairs: 8
    mapping/pair_timeout: 2.0
    mapping/worker_queue: 4
    mapping/publish_rate: 1.0
