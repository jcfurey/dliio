# EXAMPLE: Ouster in a tunnel — COIN-LIO LiDAR intensity-image anchor ON.
#
# Adds the LiDAR reflectivity-image frame-to-map term on top of the LiDAR tunnel
# mode. Unlike the narrow sideways camera (ouster_tunnel_visual.yaml), the LiDAR
# sees the walls 360deg with consistent, range-normalized reflectivity, so it has
# far more persistent landmarks to anchor the degenerate tunnel axis against.
# Requires an ORGANIZED scan (Ouster publishes 64xN); the image, spherical model,
# and per-row elevation LUT are self-calibrated from the first organized scan.
#
# Overlay ON TOP of ouster_tunnel.yaml (reflectivity + plane + gate), then this.
# No camera needed.
#
# Usage (headless, sim time, free cores -- see doc/TUNNEL_SWEEP_RUNBOOK.md):
#   ros2 launch direct_lidar_inertial_odometry dlio.launch.py \
#     pointcloud_topic:=/ouster/points imu_topic:=/ouster/imu use_sim_time:=true
#   #   --ros-args --params-file .../cfg/examples/ouster_tunnel.yaml \
#   #               --params-file .../cfg/examples/ouster_tunnel_lidarimg.yaml
#
# Watch in /diagnostics: "Lidar Map Points" (want thousands), "Lidar Map RMS"
# (lower is better; the occlusion cull should drop it vs the pre-fix ~0.4-0.6),
# "Degenerate Directions (current)", "Visual Rescued Axes".

/**:
  ros__parameters:
    odom/lidar_image/enabled: true

    # 2026-06-22: DO NOT keep tuning this scalar. Instrumenting the gate showed the
    # term rescues the degenerate axis essentially NEVER (Visual Rescued Axes ≈ 0)
    # at BOTH w0.05 and w0.30 — a no-op for the tunnel degeneracy at any sane
    # weight: its isotropic count-normalized mass lands on the strong (wall) axes
    # and is diluted off the weak along-axis, so it never clears the 0.005·λ_max
    # rescue bar and the gate erases its along-axis contribution. The "DIV" the
    # 06-18 sweep blamed on it is the baseline geometric collapse (deg=6 from
    # H_geo, term passive). The fix is a code change (direction-scaled weighting /
    # degeneracy-complementary point selection / absolute-floor rescue), NOT a
    # weight. See doc/FINDINGS_2026-06-22.md Part 2.
    #
    # Count-normalized weight (the term's Hessian mass is normalized to a nominal
    # point count, so this is comparable to the geometric term and stable
    # regardless of how many points are visible). The old raw weight 0.3
    # over-travelled because it scaled with the 5k-75k point count.
    #
    # NOT TUNED — no weight is validated on the 06042026 conduit. 2026-06-16
    # quiet-box A/B (results/dliio_tunnel_bench/sweep_quiet/NOTES.md): w0.2 looked
    # great at n=3 (3/3 bounded) but did NOT reproduce at higher n (1/4 in the
    # follow-up), and pooled clean-load OK-rate is indistinguishable from the
    # LiDAR-only baseline (~80% each). The divergence is the geometric-degeneracy
    # /solver basin (along the conduit axis), and a scalar weight does not
    # reliably move it — n=3-4 cannot even separate configs (same config swung
    # 3/3 -> 1/4). Left at the conservative 0.05 first cut pending a code-level
    # fix (early-startup collapse / per-scan along-axis gate budget) + a clean
    # high-n (>=12) decider. Do NOT trust a single-rep result on this bag.
    odom/lidar_image/weight: 0.05

    # Occlusion / wrong-surface rejection (frame-to-map): a projected map point
    # whose range to the current sensor disagrees with the pixel's range by more
    # than max(rangeAbsTol, rangeRelTol*range) is dropped. Without this the whole
    # corridor map floods near-wall pixels with far-side mismatches (the dominant
    # cause of high RMS).
    #
    # 2026-06-16: no reason to loosen these on the 06042026 conduit. Measured the
    # median engaged graffiti count (a deterministic, non-chaotic metric):
    # 0.5/0.1 -> ~890 pts/scan; loosening to 1.5/0.2 -> ~920 (NO real gain --
    # the visible-wall texture is already admitted at 0.5/0.1). Only an extreme
    # gate-off (1000/100) roughly doubled it to ~1800, and those extra points are
    # far-side / through-wall mismatches (the gate-off probe diverged). So
    # loosening cannot add usable graffiti, only noise. (The earlier "loosening
    # reintroduces divergence" read was n=3 and is not separable from basin noise
    # -- but there's no upside to loosening regardless.)
    odom/lidar_image/rangeAbsTol: 0.5     # [m]
    odom/lidar_image/rangeRelTol: 0.1     # fraction of pixel range

    # The LiDAR anchor reuses the absolute-anchor gate budget: it may correct the
    # IMU prior on a degenerate axis by at most this per scan, bounded so a wrong
    # anchor can't run away.
    odom/visual/map/gateMaxStepTrans: 1.0
    odom/visual/map/gateMaxStepRot: 0.1

    # Condition-scaled directional weighting (2026-06-22, doc/FINDINGS_2026-06-22.md
    # Part 2). The reason the weight above is a no-op for the degeneracy: the term's
    # isotropic mass lands on the strong (wall) axes and is ~250-10000x short of the
    # rescue bar on the weak (rotation) axis, so the gate erases its along-axis
    # contribution. condScale boosts the term along the geometrically-weak axes
    # (judged from the geometric Hessian) so it can clear the rescue bar there
    # without inflating the strong axes; the per-scan gate budget above still bounds
    # the motion. OFF here by default (bit-identical) -- enable + sweep power/cap to
    # test (watch for over-travel on uniform/aliased stretches).
    # odom/lidar_image/condScale/enabled: true
    # odom/lidar_image/condScale/power: 1.0    # exponent on (lambda_max/lambda_k)
    # odom/lidar_image/condScale/cap: 50.0     # max per-direction boost
